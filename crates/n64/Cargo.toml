[package]
name = "n64"
description = "N64 hardware behaviour: controller, RDP (combiner, blender, textures, CPU rasteriser), RSP semantics, VI/CRT video and the audio output chain."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

# Knows the console, not the game. The CPU half is pure Rust; the `gpu` feature
# adds the WGSL ports of the same combiner and video chain.
[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck"]

[dependencies]
glam = { workspace = true }
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[dev-dependencies]
naga = { workspace = true }
