[package]
name = "pd_game"
description = "The game: boots into Perfect Dark's menus, runs Combat Simulator matches, maps devices to N64 controllers."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
default-run = "perfect_dark"

[[bin]]
name = "perfect_dark"
path = "src/main.rs"

[dependencies]
engine = { workspace = true }
n64 = { workspace = true, features = ["gpu"] }
pd_core = { workspace = true }
pd_sim = { workspace = true }
pd_menu = { workspace = true }
pd_render = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
env_logger = { workspace = true }

[dev-dependencies]
image = { workspace = true }
