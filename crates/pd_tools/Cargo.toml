[package]
name = "pd_tools"
description = "Developer tools: offscreen snapshots, match probes, offline audio renders, and the pd_lab viewer."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "pd_snapshot"
path = "src/bin/pd_snapshot.rs"

# The simulant and route debug viewer (a window: the one tool that isn't headless).
[[bin]]
name = "pd_lab"
path = "src/bin/pd_lab.rs"

[dependencies]
engine = { workspace = true }
n64 = { workspace = true, features = ["gpu"] }
pd_core = { workspace = true }
pd_sim = { workspace = true }
pd_menu = { workspace = true }
pd_render = { workspace = true }
image = { workspace = true }
glam = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
